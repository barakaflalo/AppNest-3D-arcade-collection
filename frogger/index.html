@font-face{font-family:'Rubik';font-weight:700;src:url(../assets/fonts/rubik-la-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Rubik';font-weight:900;src:url(../assets/fonts/rubik-he-900.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;font-display:swap}
@font-face{font-family:'Rubik';font-weight:900;src:url(../assets/fonts/rubik-la-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
:root{--y:#ffc93a;--o:#ff5a1f;--c:#45d2ff;--g:#3dff8a;--r:#ff5a4a;--bg:#0b0d12;--panel:rgba(12,14,20,.78);--line:rgba(255,201,58,.55);--px:'Press Start 2P','Rubik',system-ui,sans-serif;--h:'Rubik',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--h);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.hid{display:none!important}
.muted{color:#9fb0c0;font-size:13px}
.center{text-align:center}.mt{margin-top:12px}
.logo{font-family:'Press Start 2P',monospace;font-size:clamp(22px,6.5vw,44px);color:var(--y);letter-spacing:3px;line-height:1.35;text-align:center;text-shadow:0 0 12px rgba(255,120,0,.65),3px 3px 0 #6b2200;direction:ltr}
.logo small{display:block;font-size:.42em;color:var(--c);letter-spacing:6px;text-shadow:0 0 10px rgba(0,160,255,.6);margin-top:6px}
.logo.sm{font-size:15px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.big{font-family:var(--px);font-size:clamp(14px,3.6vw,18px);padding:16px 34px;border-radius:14px;border:3px solid var(--y);background:linear-gradient(180deg,#ff7a2a,#e8400e);box-shadow:0 0 22px rgba(255,90,20,.55),inset 0 2px 0 rgba(255,255,255,.3);letter-spacing:2px}
.big:active,.btn2:active,.ib:active{transform:scale(.96)}
.big[disabled]{opacity:.45;filter:grayscale(.6)}
.btn2{font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;border:1.5px solid var(--c);background:rgba(10,14,22,.7);color:var(--c)}
.btn2.gold{border-color:var(--y);color:var(--y)}.btn2.red{border-color:var(--r);color:#ff7a6a}.btn2.green{border-color:var(--g);color:var(--g)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(10,12,18,.6);font-size:19px;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px;background:rgba(10,12,18,.65);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;color:#cfd8e2}
.seg button.on{background:var(--y);color:#1b1300}
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,10,.72);backdrop-filter:blur(3px)}
.card{width:min(460px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#151924,#0d1017);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:pan-y}
.card h2{font-family:var(--px);font-size:15px;color:var(--y);margin-bottom:14px;text-align:center;line-height:1.5}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hdr h2{flex:1;margin:0}
.backb{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:700}
table.hs{width:100%;border-collapse:collapse;font-size:14px}
table.hs th{color:var(--y);font-size:12px;border-bottom:2px solid var(--y);padding:6px}
table.hs td{padding:6px;text-align:center;color:#cfe8ff;border-bottom:1px solid rgba(255,255,255,.06)}
table.hs tr.me td{color:var(--g);font-weight:900}
table.hs td.sc{font-family:var(--px);font-size:11px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.set .seg button{padding:6px 12px;font-size:13px}
.tin{width:150px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0a0c12;color:var(--y);font-size:15px;font-weight:700;font-family:var(--h)}
.guide p{font-size:15px;line-height:1.6;margin-bottom:10px;color:#dde6ee}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.kv b{color:#9fb0c0;font-weight:500}
a.lnk,button.lnk{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;font-size:14px}
.cr{font-size:12px;color:#9fb0c0;margin-top:10px;line-height:1.6}.disc{font-size:12px;color:#8592a0;margin-top:8px}
.wal{font-family:var(--px);font-size:16px;color:#ffd84a;text-align:center;margin:4px 0 10px}
.urow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}.urow .ic{font-size:24px;width:32px;text-align:center}.urow .tx{flex:1;min-width:0}.urow .tx b{font-size:15px}.urow .tx small{display:block;font-size:12px;color:#9fb0c0}
.urow.lk{opacity:.6}.urow .rw{font-size:13px;font-weight:900;color:#ffd84a;white-space:nowrap}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:#3dff8a}
.ubuy{font-size:13px;font-weight:900;padding:8px 10px;border-radius:10px;border:1.5px solid #ffd84a;background:rgba(40,32,6,.7);color:#ffd84a;white-space:nowrap}.ubuy.no{opacity:.45}.ubuy.mx{border-color:#3dff8a;color:#3dff8a}
.dlcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,216,74,.35);border-radius:14px;padding:10px 12px;margin:8px 0}.dlcard .k{font-size:12px;color:#9fb0c0}.dlcard .v{font-size:19px;font-weight:900;color:#ffd84a}.dlcard .d{font-size:14px;color:#e8eef4}
.fs{font-family:var(--px);color:var(--g);font-size:clamp(16px,4.5vw,24px);text-shadow:0 0 10px rgba(61,255,138,.5);display:inline-block;margin:6px 0 10px}
.coinl{font-size:15px;font-weight:900;color:#ffd84a;margin:4px 0}
#toast{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);z-index:95;background:rgba(10,12,18,.94);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#achT{position:fixed;z-index:96;top:calc(max(8px,env(safe-area-inset-top)) + 4px);left:50%;transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:linear-gradient(180deg,#2b2410,#15120a);border:2px solid #ffd84a;color:#fff;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
#achT.on{transform:translate(-50%,0)}#achT .ai{font-size:28px}#achT b{color:#ffd84a}
#err{position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:11px;padding:6px;z-index:999;display:none;direction:ltr}
#load{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg)}
#load .bar{width:min(320px,70vw);height:10px;border:2px solid var(--y);border-radius:6px;overflow:hidden}
#load .fill{height:100%;width:0;background:linear-gradient(90deg,var(--o),var(--y));transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html,body{background:#0f2410}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#load{background:linear-gradient(180deg,rgba(15,36,16,.2),rgba(15,36,16,.92)),url(icon-512.png) center 30%/min(60vw,320px) no-repeat,#0f2410}
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,16,6,.78) 0%,rgba(6,16,6,.05) 32%,rgba(6,16,6,.05) 50%,rgba(6,16,6,.9) 100%);overflow-y:auto;touch-action:pan-y}
#menu .top{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#menu .logo{color:#7dff6a;text-shadow:0 0 12px rgba(60,255,90,.55),3px 3px 0 #0b4a10}
#menu .logo small{color:#ffd84a}
.iconrow{display:flex;gap:7px;width:100%;justify-content:space-between;align-items:center}.iconrow .grp{display:flex;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(10,12,18,.66);border:1px solid rgba(255,216,74,.55);color:#ffd84a;font-weight:900;font-size:14px}
.sub{font-size:clamp(12px,3.4vw,16px);color:#e2f2d8;text-shadow:0 1px 4px #000;text-align:center}
.bottom{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px}
.dd{font-size:12.5px;color:#e2f2d8;text-shadow:0 1px 3px #000;min-height:16px;text-align:center;max-width:420px}
.hud{position:fixed;inset:0;z-index:20;pointer-events:none}
.bar{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:stretch;direction:ltr}
.hb{background:rgba(8,18,10,.8);border:1px solid rgba(125,255,106,.45);border-radius:12px;padding:6px 9px;text-align:center;pointer-events:auto}
.hb .k{font-size:10px;color:#a9d6a0;font-weight:700}.hb .v{font-family:var(--px);font-size:12px;margin-top:4px}
#tbar{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
#tbo{height:10px;border-radius:5px;background:#1b2a1c;overflow:hidden}#tbi{height:100%;background:linear-gradient(90deg,#3dff8a,#ffd84a);transition:width .2s}#tbi.low{background:linear-gradient(90deg,#ff3b2f,#ff9a1f)}
#padsV{font-size:15px;letter-spacing:1px}
.pb{pointer-events:auto;width:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(8,18,10,.8);font-size:17px}
#opp{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 54px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#9fd8ff;background:rgba(8,14,24,.8);border:1px solid rgba(69,210,255,.5);border-radius:10px;padding:4px 10px}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;font-size:clamp(20px,5.6vw,34px);text-shadow:0 0 14px rgba(0,0,0,.9),0 3px 0 rgba(0,0,0,.6);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.9);padding:0 14px}
#msg.on{opacity:1;transform:scale(1)}
#pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:6px;pointer-events:auto;direction:ltr}
#pad button{border-radius:16px;border:2px solid rgba(125,255,106,.55);background:rgba(8,18,10,.55);font-size:24px;color:#cfffc4}
#pad button:active{background:rgba(61,255,138,.4)}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#pass{position:fixed;inset:0;z-index:58;background:radial-gradient(circle at 50% 40%,#16401a,#050c05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#pass .ic{font-size:64px}#pass h2{font-family:var(--px);font-size:16px;color:#ffd84a;line-height:1.6}#pass p{color:#cde6c4;font-size:15px;max-width:340px;line-height:1.5}
#tip{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 150px);max-width:min(340px,86vw);padding:12px 16px;border-radius:16px;background:rgba(10,14,24,.9);border:2px solid var(--y);font-size:15px;font-weight:700;line-height:1.45;text-align:center}
#tip small{display:block;font-size:11px;color:#9fb0c0;margin-top:4px;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;text-align:center}.stat .v{font-family:var(--px);font-size:13px;color:var(--g);margin-top:4px}.stat .k{font-size:12px;color:#9fb0c0}
#ni{font-family:var(--h);font-weight:900;font-size:22px;text-align:center;width:min(280px,80vw);padding:10px;background:#0a0c12;color:var(--y);border:3px solid var(--y);border-radius:10px;margin:10px auto;display:block}
body.nopad #pad{display:none}
@media (orientation:landscape) and (max-height:560px){#menu .logo{font-size:20px}.sub,.dd{display:none}.big{padding:10px 26px;font-size:13px}.bottom{gap:6px}#pad{left:auto;right:12px;transform:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px)}#msg{top:24%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><div class="logo" style="margin-top:38vh">FROGGER<small>3D</small></div><div class="bar"><div class="fill" id="lf"></div></div><div id="lt" class="muted">…</div></div>
<div id="menu" class="hid">
  <div class="top">
    <div class="iconrow"><div class="grp"><button class="ib" id="bArc">🕹</button><span class="chip" id="wal">🪙 0</span></div>
      <div class="grp"><button class="ib" id="bShop">🛒</button><button class="ib" id="bAch">🏅</button><button class="ib" id="bHs">🏆</button><button class="ib" id="bSet">⚙️</button><button class="ib" id="bAbout">ℹ️</button></div></div>
    <div class="logo" style="margin-top:6px">FROGGER<small>3D</small></div><div class="sub" data-t="sub"></div>
  </div>
  <div class="bottom">
    <div class="seg" id="mSeg"><button data-m="1p" data-t="m_1p"></button><button data-m="2p" data-t="m_2p"></button><button data-m="online" data-t="m_on"></button></div>
    <div class="dd" id="ddTxt"></div>
    <button class="big" id="bStart" data-t="start"></button>
    <div class="row"><button class="btn2 gold" id="bDaily">🗓 <span data-t="daily"></span></button><button class="btn2" id="bGuide">📖 <span data-t="guide"></span></button></div>
  </div>
</div>
<div id="hud" class="hud hid">
  <div class="bar"><button class="pb" id="bPause">⏸</button>
    <div class="hb"><div class="k" data-t="hudScore"></div><div class="v" id="scV">0</div></div>
    <div class="hb"><div class="k" data-t="hudLevel"></div><div class="v" id="lvV">1</div></div>
    <div class="hb" id="tbar"><div id="padsV"></div><div id="tbo"><div id="tbi"></div></div></div>
    <div class="hb"><div class="k" data-t="hudLives"></div><div class="v" id="lfV" style="font-family:var(--h);font-size:14px">🐸</div></div></div>
  <div id="opp" class="hid"></div>
  <div id="msg"></div>
  <div id="pad"><button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button><button class="d" data-d="d">▼</button><button class="r" data-d="r">▶</button></div>
</div>
<div id="pass" class="hid"><div class="ic">🐸</div><h2 id="passH"></h2><p id="passP"></p><button class="big" id="bReady" data-t="ready"></button></div>

<div class="ov hid" id="ovOver"><div class="card center"><h2 id="oTitle" style="font-size:18px"></h2><div class="stats" id="oStats"></div><div id="oCoins" class="coinl"></div>
